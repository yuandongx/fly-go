version: '3.8'

services:

  # app:
  #   image: nginx:latest
  #   volumes:
  #     - /home/develop/data/web/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - /home/develop/data/web/dist:/app/dist:ro
  #     - /home/develop/data/app:/app/bin:rw
  #   command: [nginx-debug, '-g', 'daemon off;']
  #   ports:
  #     - "80:80"
  #     - "8080:8080"
  #   networks:
  #     - app-network

  mongo:
    image: mongo
    ports:
      - 8717:27017
    volumes:
      - /home/develop/data/mongodb/db:/data/db
    networks:
      - app-network
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - 8081:8081
    networks:
      - app-network
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_URL: mongodb://root:example@mongo:27017/
      ME_CONFIG_BASICAUTH: "false"


networks:
  app-network:
    driver: overlay
    attachable: true
    name: app_network
    # external: true
